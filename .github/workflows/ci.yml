name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked

  msrv:
    name: Rust 1.85 MSRV
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libudev-dev libwayland-dev libx11-dev
          libxcursor-dev libxi-dev libxkbcommon-dev libxrandr-dev pkg-config
      - run: cargo check --workspace --all-targets --all-features --locked

  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            artifact: macOS-arm64
            archive: tar.gz
          - name: Linux x64
            os: ubuntu-24.04
            artifact: Linux-x64
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libudev-dev libwayland-dev libx11-dev
          libxcursor-dev libxi-dev libxkbcommon-dev libxrandr-dev pkg-config
      - run: cargo build --workspace --all-targets --release --locked
      - name: Build macOS application bundle
        if: github.event_name == 'push' && runner.os == 'macOS'
        run: ./packaging/macos/bundle.sh
      - name: Package macOS release candidate
        if: github.event_name == 'push' && runner.os == 'macOS'
        shell: bash
        run: |
          package_name="us-hr-custom-control-macOS-arm64"
          package_dir="dist/${package_name}"
          mkdir -p "${package_dir}"
          cp target/release/us-hr-cli "${package_dir}/"
          cp -R "target/release/US-HR Custom Control.app" "${package_dir}/"
          cp README.md LICENSE "${package_dir}/"
          tar -czf "dist/${package_name}.tar.gz" -C dist "${package_name}"
      - name: Package Linux release candidate
        if: github.event_name == 'push' && runner.os == 'Linux'
        shell: bash
        run: |
          package_name="us-hr-custom-control-Linux-x64"
          package_dir="dist/${package_name}"
          mkdir -p "${package_dir}"
          cp target/release/us-hr-control target/release/us-hr-cli "${package_dir}/"
          cp packaging/linux/99-tascam-us-hr.rules "${package_dir}/"
          cp assets/app-icon.png "${package_dir}/"
          cp README.md LICENSE "${package_dir}/"
          tar -czf "dist/${package_name}.tar.gz" -C dist "${package_name}"
      - name: Upload release candidate
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-${{ matrix.artifact }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          path: dist/us-hr-custom-control-${{ matrix.artifact }}.${{ matrix.archive }}

  windows:
    name: Windows x64 build and test
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo build --workspace --release --locked
      - name: Check PowerShell script syntax
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "packaging/windows/collect-driver-info.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
      # Packaged on pull requests too, so Windows builds can be tested before
      # merging; the release workflow only uses artifacts from pushes to main.
      - name: Package Windows release candidate
        shell: pwsh
        run: |
          $packageName = "us-hr-custom-control-Windows-x64"
          $packageDir = Join-Path "dist" $packageName
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item "target/release/us-hr-control.exe" $packageDir
          Copy-Item "target/release/us-hr-cli.exe" $packageDir
          Copy-Item "packaging/windows/collect-driver-info.ps1" $packageDir
          Copy-Item "README.md" $packageDir
          Copy-Item "LICENSE" $packageDir
          Compress-Archive -Path $packageDir -DestinationPath "dist/$packageName.zip"
      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-Windows-x64
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          path: dist/us-hr-custom-control-Windows-x64.zip

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  coverage:
    name: Coverage (minimum 35%)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Measure and enforce line coverage
        run: >-
          cargo llvm-cov --workspace --all-features --summary-only
          --fail-under-lines 35 --locked
      - name: Generate HTML coverage report
        run: cargo llvm-cov report --html
      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: target/llvm-cov/html
          if-no-files-found: error
          retention-days: 14
