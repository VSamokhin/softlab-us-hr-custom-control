name: Release builds

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

concurrency:
  group: release-candidate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare release candidate
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.candidate.outputs.commit_sha }}
      release_tag: ${{ steps.candidate.outputs.release_tag }}
      version: ${{ steps.candidate.outputs.version }}
      should_release: ${{ steps.candidate.outputs.should_release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Select and push release-candidate tag
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          set_output() {
            printf '%s\n' "$1" >> "${GITHUB_OUTPUT}"
          }

          set_output "commit_sha=${RELEASE_SHA}"

          existing_tag="$({
            git tag --points-at "${RELEASE_SHA}" --list 'v*' |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true
          } | sort -V | tail -n 1)"

          if [[ -n "${existing_tag}" ]]; then
            if (( RUN_ATTEMPT > 1 )); then
              echo "Reusing ${existing_tag}, which already points at ${RELEASE_SHA}."
              set_output "release_tag=${existing_tag}"
              set_output "version=${existing_tag#v}"
              set_output "should_release=true"
            else
              {
                echo "### Release candidate already handled"
                echo
                echo "Tag ${existing_tag} already points at commit \`${RELEASE_SHA}\`."
                echo "Rerun its original release workflow if packaging needs to be retried."
              } >> "${GITHUB_STEP_SUMMARY}"
              set_output "should_release=false"
            fi
            exit 0
          fi

          pending_draft=""
          while IFS=$'\t' read -r draft_tag draft_url; do
            if git show-ref --verify --quiet "refs/tags/${draft_tag}"; then
              pending_draft="${draft_tag} ${draft_url}"
              break
            fi
          done < <(
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.draft) | [.tag_name, .html_url] | @tsv'
          )

          if [[ -n "${pending_draft}" ]]; then
            {
              echo "### Release candidate not created"
              echo
              echo "A draft release is still pending: ${pending_draft}"
              echo
              echo "Publish or delete that draft before pushing the next candidate."
            } >> "${GITHUB_STEP_SUMMARY}"
            set_output "should_release=false"
            exit 0
          fi

          latest_tag="$({
            git tag --list 'v*' |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true
          } | sort -V | tail -n 1)"

          if [[ -z "${latest_tag}" ]]; then
            version="$({
              sed -n '/^\[workspace\.package\]$/,/^\[/p' Cargo.toml |
                sed -nE 's/^version = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p'
            } | head -n 1)"
            if [[ -z "${version}" ]]; then
              echo "Could not read the initial stable version from [workspace.package]." >&2
              exit 1
            fi
          else
            version="${latest_tag#v}"
            IFS=. read -r major minor patch <<< "${version}"
            version="${major}.${minor}.$((10#${patch} + 1))"
          fi

          release_tag="v${version}"
          if git show-ref --verify --quiet "refs/tags/${release_tag}"; then
            echo "Refusing to replace existing tag ${release_tag}." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "${release_tag}" "${RELEASE_SHA}" \
            --message "US-HR Custom Control ${release_tag}"
          git push origin "refs/tags/${release_tag}"

          set_output "release_tag=${release_tag}"
          set_output "version=${version}"
          set_output "should_release=true"
          {
            echo "### Release candidate ${release_tag}"
            echo
            echo "Tagged commit \`${RELEASE_SHA}\` after CI completed successfully."
          } >> "${GITHUB_STEP_SUMMARY}"

  draft-release:
    name: Create draft GitHub Release
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      pull-requests: read
    steps:
      - name: Download packaged builds
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: release-candidate-*
          path: release-assets
          merge-multiple: true
      - name: Add release tag to package names
        working-directory: release-assets
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          mv us-hr-custom-control-macOS-arm64.tar.gz \
            "us-hr-custom-control-${RELEASE_TAG}-macOS-arm64.tar.gz"
          mv us-hr-custom-control-Linux-x64.tar.gz \
            "us-hr-custom-control-${RELEASE_TAG}-Linux-x64.tar.gz"
          mv us-hr-custom-control-Windows-x64.zip \
            "us-hr-custom-control-${RELEASE_TAG}-Windows-x64.zip"
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum ./* > SHA256SUMS
      - name: Create or update draft release
        id: release-drafter
        uses: release-drafter/release-drafter@v7
        with:
          name: ${{ needs.prepare.outputs.release_tag }}
          tag: ${{ needs.prepare.outputs.release_tag }}
          version: ${{ needs.prepare.outputs.version }}
          commitish: ${{ needs.prepare.outputs.commit_sha }}
      - name: Attach packaged builds to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: >-
          gh release upload "${RELEASE_TAG}" release-assets/* --clobber
          --repo "${GITHUB_REPOSITORY}"
      - name: Add release link to workflow summary
        env:
          RELEASE_URL: ${{ steps.release-drafter.outputs.html_url }}
        run: |
          echo "Draft release: ${RELEASE_URL}" >> "${GITHUB_STEP_SUMMARY}"
