[package]
name = "us-hr-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
us-hr-core = { path = "../us-hr-core", version = "0.1.0" }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

# This crate holds the project's only FFI. It copies the workspace lint policy,
# except that `unsafe_code` is `deny` rather than `forbid` so the Windows FFI
# module can opt in explicitly. Keep these lists in sync with the workspace.
[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"
